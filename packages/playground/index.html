<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demo/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAVG Playground</title>

    <style type="text/css">
      :root {
        --transformScale: 1;
        --positionWidth: 1920px;
        --positionHeight: 1080px;
      }

      * {
        margin: 0;
        padding: 0;
      }

      ._container {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        background-color: black;
      }

      ._position {
        width: var(--positionWidth);
        height: var(--positionHeight);
      }

      ._box {
        height: 1080px;
        width: 1920px;
        background-color: black;
        transform: scale(var(--transformScale));
        transform-origin: 0% 0%;
      }
    </style>
  </head>
  <body>
    <div class="_container">
      <div class="_position">
        <div class="_box">
          <div id="app"></div>
        </div>
      </div>
    </div>
    <script>
      const width = 1920
      const height = 1080
      const ratio = 16 / 9

      const getBaseScale = () => {
        const element = document.getElementsByClassName('_container')[0]
        const w = element.clientWidth
        const h = element.clientHeight
        let s = 1
        if (w / h >= ratio) {
          s = h / height
        } else {
          s = w / width
        }

        const pw = s * 1920 + 'px'
        const ph = s * 1080 + 'px'

        document.getElementsByTagName('body')[0].style.setProperty('--transformScale', s)
        document.getElementsByTagName('body')[0].style.setProperty('--positionWidth', pw)
        document.getElementsByTagName('body')[0].style.setProperty('--positionHeight', ph)
      }

      onresize = getBaseScale
      onload = getBaseScale
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
